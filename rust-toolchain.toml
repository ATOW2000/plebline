# The compiler the packages are built with. Another version gives other bytes,
# so a rebuild could not be compared: changing it is a visible commit
# (docs/REPRODUCIBLE.md).
[toolchain]
channel = "1.94.1"
profile = "minimal"
components = ["rustfmt", "clippy"]
# The Tails package (scripts/build-app.sh).
targets = ["x86_64-unknown-linux-gnu"]
