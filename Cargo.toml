[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
license = "MIT"

[workspace.dependencies]
plebline-core = { path = "crates/plebline-core" }

bdk_wallet = { version = "3.1.0", features = ["keys-bip39"] }
rand_core = "0.6.4"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = { version = "1", features = ["derive"] }

[profile.release]
# Small binaries, since they are carried on a USB stick.
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
